name: build-addons

on:
  push:
    branches: [ addons-trigger ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-addons
  cancel-in-progress: false

env:
  GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct
  GOSUMDB: off

jobs:
  addons:
    runs-on: ubuntu-22.04
    timeout-minutes: 200

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools python3-pip rsync swig \
            unzip zip zlib1g-dev libelf-dev libiberty-dev dwarves ccache bc \
            bzip2 xz-utils patch diffutils perl wget curl

      - name: Clone source + feeds
        run: |
          git clone --depth 1 -b 25.12 https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt
          cd openwrt
          ./scripts/feeds update -a > ../feeds.log 2>&1
          ./scripts/feeds install -a >> ../feeds.log 2>&1

      - name: Configure (only passwall + xray, every optional INCLUDE off)
        run: |
          cd openwrt
          cp defconfig/mt7981-ax3000.config .config
          cat >> .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cudy_tr3000-v1-ubootmod=y
          CONFIG_PACKAGE_luci-app-passwall=m
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geoview is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SmartDNS is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadow_TLS is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Brook is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin is not set
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=m
          CONFIG_PACKAGE_xray-core=m
          EOF
          make defconfig > ../cfg.log 2>&1 || true
          echo "== selected =="
          grep -E "^CONFIG_PACKAGE_(luci-app-passwall|luci-i18n-passwall-zh-cn|xray-core)=" .config || echo "WARN none"
          grep -E "_INCLUDE_.*=" .config | head -20

      - name: Build host tools
        run: |
          cd openwrt
          make -j"$(nproc)" tools/install > ../tools.log 2>&1 || { tail -n 40 ../tools.log ; exit 1 ; }

      - name: Build toolchain
        run: |
          cd openwrt
          make -j"$(nproc)" toolchain/install > ../tc.log 2>&1 || { tail -n 100 ../tc.log ; exit 1 ; }

      - name: Build passwall packages
        run: |
          cd openwrt
          : > ../addons.log
          for t in luci-app-passwall luci-i18n-passwall-zh-cn xray-core ; do
            echo "===== compile $t =====" >> ../addons.log
            if make -j"$(nproc)" "package/$t/compile" >> ../addons.log 2>&1 ; then
              echo "OK   $t" | tee -a ../addons.log
            else
              echo "FAIL $t" | tee -a ../addons.log
              tail -n 40 ../addons.log
            fi
          done
          find bin/packages -name '*.apk' | sed 's|.*/||' | sort

      - name: Bundle (apks + sing-box binary)
        if: always()
        run: |
          mkdir -p bundle out/packages
          for f in $(find openwrt/bin/packages -name '*.apk' 2>/dev/null); do
            case "$(basename "$f")" in
              luci-app-passwall-*|luci-i18n-passwall-*|xray-core-*) cp -v "$f" bundle/ || true ;;
            esac
          done
          # sing-box 1.14.4 arm64 官方二进制（静态编译，直接拷贝即可当内核用）
          curl -sSL -m 180 -o sb.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-arm64.tar.gz || true
          if [ -s sb.tar.gz ] ; then
            tar xzf sb.tar.gz || true
            find . -maxdepth 3 -type f -name 'sing-box' | head -3
            cp -v $(find . -maxdepth 3 -type f -name 'sing-box' | head -1) bundle/sing-box 2>/dev/null || true
            chmod +x bundle/sing-box 2>/dev/null || true
          fi
          ls -lh bundle
          printf '%s\n' \
            '#!/bin/sh' \
            'cd "$(dirname "$0")" || exit 1' \
            'echo ">> 安装 PassWall 本体 + LuCI + 中文包 + xray 内核"' \
            'if apk add --allow-untrusted ./*.apk 2>/dev/null ; then echo ">> apk OK" ; else' \
            '  for f in ./*.apk ; do apk add --allow-untrusted "$f" || echo "!! failed: $f" ; done ; fi' \
            'if [ -f ./sing-box ] ; then' \
            '  cp -f ./sing-box /usr/bin/sing-box && chmod +x /usr/bin/sing-box' \
            '  echo ">> sing-box 内核已就位：$(/usr/bin/sing-box version 2>/dev/null | head -1)"' \
            'fi' \
            'echo ">> 完成：LuCI -> 服务 -> PassWall（内核选 Xray 或 Sing-box）"' > bundle/install.sh
          chmod +x bundle/install.sh
          printf '%s\n' 'Cudy TR3000 / ImmortalWrt 25.12 - PassWall 插件包（仅 xray + sing-box 内核）' \
            '1) 整目录传到路由器 /tmp/passwall/' \
            '2) ssh: cd /tmp/passwall && sh install.sh' \
            '3) LuCI -> 服务 -> PassWall' \
            '' '包含：luci-app-passwall（本体+LuCI）、中文语言包、xray-core apk、sing-box 1.14.4 arm64 二进制' \
            '固件已内置全部硬依赖，无需再装其他东西' \
            '' '注：GeoIP/Geosite 数据库没打包，需要时在 PassWall 里点「更新」在线下载' > bundle/README.txt
          if ls bundle/*.apk >/dev/null 2>&1 ; then
            STAMP=$(date -u +%Y%m%d-%H%M)
            ( cd bundle && zip -r -q "../out/packages/tr3000-passwall-min-${STAMP}.zip" . )
            ls -lh out/packages/*.zip
          fi

      - name: Upload to latest release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls out/packages/*.zip >/dev/null 2>&1 ; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            echo "target release: $TAG"
            gh release upload "$TAG" out/packages/*.zip --clobber
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-addons
          path: |
            out/
            addons.log
          if-no-files-found: warn
          retention-days: 30

      - name: Push logs to branch
        if: always()
        continue-on-error: true
        run: |
          mkdir -p diag
          cp openwrt/.config diag/config-addons.txt 2>/dev/null || true
          for f in feeds cfg tools tc addons ; do tail -n 400 "$f.log" > "diag/$f-tail.log" 2>/dev/null || true; done
          find openwrt/bin/packages -name '*.apk' 2>/dev/null | sed 's|.*/||' | sort > diag/apk-list.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B addons-diag
          git add -f diag
          git commit -m "addons diag $(date -u +%Y%m%d-%H%M)" || echo "nothing to commit"
          git push -f origin addons-diag
