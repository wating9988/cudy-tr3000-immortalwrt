name: build-addons

on:
  push:
    branches: [ addons-trigger ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-addons
  cancel-in-progress: false

env:
  GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct
  GOSUMDB: off
  GOFLAGS: -mod=mod

jobs:
  addons:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools python3-pip rsync swig \
            unzip zip zlib1g-dev libelf-dev libiberty-dev dwarves ccache bc \
            bzip2 xz-utils patch diffutils perl wget curl
          nproc && free -h

      - name: Clone source + feeds
        run: |
          git clone --depth 1 -b 25.12 https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt
          cd openwrt
          ./scripts/feeds update -a > ../feeds.log 2>&1
          ./scripts/feeds install -a >> ../feeds.log 2>&1

      - name: Configure (same shape as working run #1)
        run: |
          cd openwrt
          cp defconfig/mt7981-ax3000.config .config
          cat >> .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cudy_tr3000-v1-ubootmod=y
          CONFIG_PACKAGE_luci-app-passwall=m
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=y
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox is not set
          # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geoview is not set
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=m
          CONFIG_PACKAGE_v2ray-geodata=m
          CONFIG_PACKAGE_simple-obfs=m
          EOF
          make defconfig > ../cfg.log 2>&1 || true
          echo "== selected =="
          grep -E "^CONFIG_PACKAGE_(luci-app-passwall|luci-i18n-passwall-zh-cn|v2ray-geodata|simple-obfs|xray-core)=" .config || echo "WARN none"
          grep -E "^# CONFIG_PACKAGE_luci-app-passwall is not set" .config || true
          grep -E "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cudy_tr3000-v1-ubootmod=" .config || true
          grep -E "^CONFIG_TARGET_MULTI_PROFILE" .config || true

      - name: Build host tools
        run: |
          cd openwrt
          make -j"$(nproc)" tools/install > ../tools.log 2>&1 || { echo "TOOLS FAILED" ; tail -n 60 ../tools.log ; exit 1 ; }

      - name: Build toolchain (required before package compile)
        run: |
          cd openwrt
          make -j"$(nproc)" toolchain/install > ../tc.log 2>&1 || { echo "TOOLCHAIN FAILED" ; tail -n 120 ../tc.log ; exit 1 ; }
          echo "toolchain ok"

      - name: Build packages one by one
        run: |
          cd openwrt
          : > ../addons.log
          for t in luci-app-passwall luci-i18n-passwall-zh-cn v2ray-geodata simple-obfs xray-core ; do
            echo "===== compile $t =====" >> ../addons.log
            if make -j"$(nproc)" "package/$t/compile" >> ../addons.log 2>&1 ; then
              echo "OK   $t" | tee -a ../addons.log
            else
              echo "FAIL $t" | tee -a ../addons.log
              tail -n 60 ../addons.log
            fi
          done
          echo "== apk list =="
          find bin/packages -name '*.apk' 2>/dev/null | sed 's|.*/||' | sort

      - name: Bundle apk
        if: always()
        run: |
          mkdir -p bundle out/packages
          for f in $(find openwrt/bin/packages -name '*.apk' 2>/dev/null); do
            case "$(basename "$f")" in
              luci-app-passwall-*|luci-i18n-passwall-*|xray-core-*|v2ray-geoip-*|v2ray-geosite-*|simple-obfs-*|geoview-*)
                cp -v "$f" bundle/ || true ;;
            esac
          done
          ls -lh bundle || true
          printf '%s\n' '#!/bin/sh' 'cd "$(dirname "$0")" || exit 1' \
            'echo ">> 安装 PassWall 本体 + 内核"' \
            'if apk add --allow-untrusted ./*.apk 2>/dev/null ; then echo ">> OK" ; else' \
            '  for f in ./*.apk ; do apk add --allow-untrusted "$f" || echo "!! failed: $f" ; done ; fi' \
            'echo ">> 完成：LuCI -> 服务 -> PassWall"' > bundle/install.sh
          chmod +x bundle/install.sh
          printf '%s\n' 'Cudy TR3000 / ImmortalWrt 25.12 - PassWall 完整插件包（apk）' \
            '1) 整目录传到路由器 /tmp/passwall/' \
            '2) ssh: cd /tmp/passwall && sh install.sh' \
            '3) LuCI -> 服务 -> PassWall' \
            '' '固件里已内置依赖：coreutils* curl dnsmasq-full dns2socks microsocks tcping' \
            '  ipt2socks chinadns-ng lyaml lua libuci-lua luci-compat luci-lib-jsonc ip-full sing-box' \
            '' '本包含：luci-app-passwall 本体+LuCI、中文语言包、xray-core、v2ray-geoip/geosite、simple-obfs' > bundle/README.txt
          if ls bundle/*.apk >/dev/null 2>&1 ; then
            STAMP=$(date -u +%Y%m%d-%H%M)
            ( cd bundle && zip -r -q "../out/packages/tr3000-passwall-full-${STAMP}.zip" . )
            ls -lh out/packages/*.zip
          else
            echo "no apk produced"
          fi

      - name: Upload to latest release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls out/packages/*.zip >/dev/null 2>&1 ; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            echo "target release: $TAG"
            gh release upload "$TAG" out/packages/*.zip --clobber
          else
            echo "nothing to upload"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-addons
          path: |
            out/
            addons.log
          if-no-files-found: warn
          retention-days: 30

      - name: Push logs to branch
        if: always()
        continue-on-error: true
        run: |
          mkdir -p diag
          cp openwrt/.config diag/config-addons.txt 2>/dev/null || true
          for f in feeds cfg tools tc addons ; do tail -n 500 "$f.log" > "diag/$f-tail.log" 2>/dev/null || true; done
          find openwrt/bin/packages -name '*.apk' 2>/dev/null | sed 's|.*/||' | sort > diag/apk-list.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B addons-diag
          git add -f diag
          git commit -m "addons diag $(date -u +%Y%m%d-%H%M)" || echo "nothing to commit"
          git push -f origin addons-diag

      - name: Summary
        if: always()
        run: |
          {
            echo "## 插件包构建"
            echo ""
            echo "- apk 数量：$(ls bundle/*.apk 2>/dev/null | wc -l)"
            echo "- 列表：$(ls bundle 2>/dev/null | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
