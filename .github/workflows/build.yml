name: build-tr3000-v6

on:
  push:
    branches: [ main ]
    paths:
      - 'trigger/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tr3000-v6
  cancel-in-progress: false

env:
  GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct
  GOSUMDB: off

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4

      - name: Prepare tag
        run: echo "TAG=fw-v6-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools python3-pip rsync swig \
            unzip zip zlib1g-dev libelf-dev libiberty-dev dwarves ccache bc \
            bzip2 xz-utils patch diffutils perl wget curl
          nproc && free -h

      - name: Clone source
        run: |
          git clone --depth 1 -b 25.12 https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt

      - name: Feeds + third-party packages
        run: |
          cd openwrt
          ./scripts/feeds update -a

          # 去掉与 passwall-packages 重复的包，避免同名 package 冲突
          for p in xray-core sing-box chinadns-ng dns2socks microsocks tcping \
                   simple-obfs v2ray-geodata ipt2socks geoview v2ray-plugin \
                   xray-plugin shadowsocks-rust shadowsocksr-libev naiveproxy \
                   hysteria shadow-tls smartdns; do
            rm -rf "feeds/packages/net/$p"
          done
          rm -rf feeds/luci/applications/luci-app-passwall

          ./scripts/feeds install -a

          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall-packages
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/passwall-luci
          git clone --depth 1 https://github.com/kenzok8/openwrt-clashoo.git package/openwrt-clashoo
          echo "== 3rd party =="
          ls package/passwall-packages | head -20
          ls package/openwrt-clashoo

      - name: Overlay + patch + generate config
        run: |
          mkdir -p openwrt/files
          cp -a overlay/etc openwrt/files/
          chmod 0755 openwrt/files/etc/uci-defaults/99-tr3000-defaults
          chmod 0755 openwrt/files/etc/hotplug.d/net/99-usbwan
          chmod 0600 openwrt/files/etc/shadow

          python3 scripts/patch_sources.py openwrt
          python3 scripts/gen_config.py openwrt/defconfig/mt7981-ax3000.config openwrt/.config

          cd openwrt
          make defconfig
          echo "== selected =="
          grep -E "DEVICE_cudy_tr3000|^CONFIG_PACKAGE_(clashoo|luci-app-clashoo|luci-app-passwall|ksmbd-hotplug|xray-core|sing-box)=" .config || true

      - name: Verify critical symbols
        run: |
          miss=0
          while read -r sym ; do
            [ -z "$sym" ] && continue
            grep -qx "$sym" openwrt/.config || { echo "MISS $sym" ; miss=$((miss + 1)) ; }
          done < config/required.txt
          echo "missing=$miss"
          [ "$miss" -eq 0 ]

      - name: Build firmware (ubootmod / ITB)
        run: |
          set -o pipefail
          cd openwrt
          START=$(date +%s)
          make -j"$(nproc)" > ../build.log 2>&1 || { echo "BUILD FAILED" ; tail -n 800 ../build.log ; exit 1 ; }
          echo "build seconds: $(( $(date +%s) - START ))"
          echo "== images =="
          ls -lh bin/targets/mediatek/filogic/ | tail -30

      - name: Collect firmware
        if: success()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/firmware" "$GITHUB_WORKSPACE/out/diag"
          cd openwrt/bin/targets/mediatek/filogic
          find . -maxdepth 1 -type f \( -name '*.itb' -o -name '*.manifest' -o -name 'sha256sums' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/out/firmware/" \;
          cd "$GITHUB_WORKSPACE"
          cp openwrt/.config out/firmware/config-built.txt
          cp openwrt/.config out/diag/config-built.txt
          awk -F' - ' '{print $1}' openwrt/bin/targets/mediatek/filogic/*.manifest | sort -u > out/diag/packages.txt || true
          ls -lh out/firmware

      - name: Publish firmware release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(ls out/firmware/* 2>/dev/null | tr '\n' ' ')
          gh release create "${TAG}" \
            --title "TR3000 固件 ${TAG}（ImmortalWrt 25.12 / 闭源 mt_wifi / ITB）" \
            --notes-file .github/RELEASE_NOTES.md $FILES 2>&1 | tail -5 || true
          echo "release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          gh release view "${TAG}" --json assets -q '.assets[].name' || true

      - name: Build addon packages (xray + sing-box, not in firmware)
        continue-on-error: true
        run: |
          cd openwrt
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_xray-core=m
          CONFIG_PACKAGE_sing-box=m
          EOF
          make defconfig > ../addons.log 2>&1
          echo "== addon config =="
          grep -E "^CONFIG_PACKAGE_(xray-core|sing-box)=" .config || echo "WARN none selected"
          make -j"$(nproc)" package/passwall-packages/xray-core/compile package/passwall-packages/sing-box/compile >> ../addons.log 2>&1 || {
            echo "ADDON BUILD FAILED"
            tail -n 500 ../addons.log
            exit 1
          }
          find bin/packages -type f \( -name 'xray-core-*.apk' -o -name 'sing-box-*.apk' \) | sort

      - name: Bundle addons
        if: always()
        run: |
          mkdir -p out/packages bundle-apk out/diag
          find openwrt/bin/packages -type f \( -name 'xray-core-*.apk' -o -name 'sing-box-*.apk' \) 2>/dev/null | while read -r f ; do
            cp -v "$f" bundle-apk/ || true
          done
          tail -n 300 addons.log > out/diag/addons-tail.txt 2>/dev/null || true
          printf '%s\n' '#!/bin/sh' 'cd "$(dirname "$0")" || exit 1' \
            'echo ">> 安装 Xray / Sing-box 内核（不进固件，按需安装）"' \
            'for f in ./*.apk ; do apk add --allow-untrusted "$f" || echo "!! failed: $f" ; done' \
            'echo ">> 完成。PassWall -> 服务 -> PassWall，选择 xray-core 或 sing-box"' > bundle-apk/install.sh
          chmod +x bundle-apk/install.sh
          printf '%s\n' 'Cudy TR3000 - PassWall 内核包（25.12 是 .apk 格式）' \
            '内含：xray-core、sing-box 两个独立 apk。' \
            '固件里没有这两个内核；PassWall 插件本体已经内置。' \
            '安装：整个目录传到 /tmp/passwall/，cd /tmp/passwall && sh install.sh' \
            '之后在 LuCI -> 服务 -> PassWall 里选择 xray-core 或 sing-box。' > bundle-apk/README.txt
          if ls bundle-apk/*.apk >/dev/null 2>&1 ; then
            STAMP=$(date -u +%Y%m%d-%H%M)
            ( cd bundle-apk && zip -r -q "../out/packages/tr3000-passwall-cores-${STAMP}.zip" . )
            ls -lh out/packages/*.zip
          else
            echo "no apk produced"
          fi

      - name: Upload addons to release
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls out/packages/*.zip >/dev/null 2>&1 ; then
            gh release upload "${TAG}" out/packages/*.zip --clobber
            echo "addons uploaded"
          else
            echo "nothing to upload"
          fi

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-v6-firmware-and-cores
          path: |
            out/
            build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Dump diagnostics on failure
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p diag
          cp openwrt/.config diag/config-$(date -u +%H%M).txt 2>/dev/null || true
          tail -n 1000 build.log > diag/build-tail.log 2>/dev/null || true
          tail -n 500 addons.log > diag/addons-tail.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "diag-run-${{ github.run_number }}"
          git add -f diag
          git commit -m "diag run ${{ github.run_number }}" || echo "nothing to commit"
          git push -f origin "diag-run-${{ github.run_number }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo ""
            echo "- 运行号：${{ github.run_number }}"
            echo "- 固件：$(ls out/firmware 2>/dev/null | tr '\n' ' ')"
            echo "- 内核包：$(ls out/packages 2>/dev/null | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
